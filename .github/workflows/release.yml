name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build release (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: relo-linux-x64
            rustflags: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: relo-linux-arm64
            rustflags: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: relo-macos-x64
            rustflags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: relo-macos-arm64
            rustflags: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: relo-windows-x64
            rustflags: -C target-feature=+crt-static
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: relo-windows-arm64
            rustflags: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test release binary
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/relo --version

      - name: Smoke test Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/relo.exe --version

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          package="${{ matrix.artifact }}"
          mkdir -p "dist/${package}" "dist/assets"
          cp "target/${target}/release/relo" "dist/${package}/"
          cp README.md README.zh-CN.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/assets/${package}.tar.gz" "${package}"
          shasum -a 256 "dist/assets/${package}.tar.gz" > "dist/assets/${package}.tar.gz.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $package = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path "dist/$package", "dist/assets" | Out-Null
          Copy-Item "target/$target/release/relo.exe" "dist/$package/"
          Copy-Item README.md, README.zh-CN.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/assets/$package.zip" -Force
          $hash = (Get-FileHash "dist/assets/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Out-File -Encoding ascii "dist/assets/$package.zip.sha256"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/assets/*
          generate_release_notes: true
